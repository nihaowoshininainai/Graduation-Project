
services:
  web:
    build: ./java
    network_mode: "host"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
  db:
    build: ./mysql/.
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
  nginx:
    build: ./nginx/.
    ports:
      - "80:80"
      - "90:90"
    depends_on:
      - web
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    environment:
      - requirepass=123456